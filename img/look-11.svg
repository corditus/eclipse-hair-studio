<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" width="1000" height="1200" role="img" aria-label="Air-dried waves placeholder">
  <defs>
    <linearGradient id="bg1255" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2EADF"/>
      <stop offset="1" stop-color="#DBC1A6"/>
    </linearGradient>
    <radialGradient id="glow1255" cx="45%" cy="34%" r="72%">
      <stop offset="0" stop-color="#FFFDF9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFDF9" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain1255">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <linearGradient id="shade1255" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.34"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="1200" fill="url(#bg1255)"/>
  <rect width="1000" height="1200" fill="url(#glow1255)"/>
  <rect width="1000" height="1200" filter="url(#grain1255)" opacity="0.25"/>
  <rect width="1000" height="1200" fill="url(#shade1255)"/>
  <g fill="#FFFDF9" font-family="Georgia, 'Times New Roman', serif">
    <text x="55" y="1080" font-size="62" font-style="italic" opacity="0.95">Air-dried waves</text>
    <text x="55" y="1135" font-family="Helvetica, Arial, sans-serif" font-size="22" letter-spacing="4" opacity="0.72" text-transform="uppercase">Look</text>
  </g>
  <rect x="0.5" y="0.5" width="999" height="1199" fill="none" stroke="#A5714F" stroke-opacity="0.25"/>
</svg>
