<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1280" width="1920" height="1280" role="img" aria-label="Signature colour placeholder">
  <defs>
    <linearGradient id="bg1920" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E7D8C6"/>
      <stop offset="1" stop-color="#C79A7B"/>
    </linearGradient>
    <radialGradient id="glow1920" cx="60%" cy="34%" r="72%">
      <stop offset="0" stop-color="#FFFDF9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFDF9" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain1920">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <linearGradient id="shade1920" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.34"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1280" fill="url(#bg1920)"/>
  <rect width="1920" height="1280" fill="url(#glow1920)"/>
  <rect width="1920" height="1280" filter="url(#grain1920)" opacity="0.23"/>
  <rect width="1920" height="1280" fill="url(#shade1920)"/>
  <g fill="#FFFDF9" font-family="Georgia, 'Times New Roman', serif">
    <text x="105" y="1152" font-size="79" font-style="italic" opacity="0.95">Signature colour</text>
    <text x="105" y="1223" font-family="Helvetica, Arial, sans-serif" font-size="28" letter-spacing="5" opacity="0.72" text-transform="uppercase">Eclipse Hair Salon</text>
  </g>
  <rect x="0.5" y="0.5" width="1919" height="1279" fill="none" stroke="#8A4F38" stroke-opacity="0.25"/>
</svg>
