<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-label="Curtain fringe placeholder">
  <defs>
    <linearGradient id="bg1170" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E4D3C4"/>
      <stop offset="1" stop-color="#B98A6C"/>
    </linearGradient>
    <radialGradient id="glow1170" cx="45%" cy="22%" r="72%">
      <stop offset="0" stop-color="#FFFDF9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFDF9" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain1170">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <linearGradient id="shade1170" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.34"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg1170)"/>
  <rect width="1000" height="1000" fill="url(#glow1170)"/>
  <rect width="1000" height="1000" filter="url(#grain1170)" opacity="0.22"/>
  <rect width="1000" height="1000" fill="url(#shade1170)"/>
  <g fill="#FFFDF9" font-family="Georgia, 'Times New Roman', serif">
    <text x="55" y="900" font-size="62" font-style="italic" opacity="0.95">Curtain fringe</text>
    <text x="55" y="955" font-family="Helvetica, Arial, sans-serif" font-size="22" letter-spacing="4" opacity="0.72" text-transform="uppercase">Look</text>
  </g>
  <rect x="0.5" y="0.5" width="999" height="999" fill="none" stroke="#6E3F2E" stroke-opacity="0.25"/>
</svg>
