<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="900" height="1100" role="img" aria-label="Mara placeholder">
  <defs>
    <linearGradient id="bg951" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0E7DB"/>
      <stop offset="1" stop-color="#D3B79C"/>
    </linearGradient>
    <radialGradient id="glow951" cx="60%" cy="34%" r="72%">
      <stop offset="0" stop-color="#FFFDF9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFDF9" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain951">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <linearGradient id="shade951" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.34"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1100" fill="url(#bg951)"/>
  <rect width="900" height="1100" fill="url(#glow951)"/>
  <rect width="900" height="1100" filter="url(#grain951)" opacity="0.24"/>
  <rect width="900" height="1100" fill="url(#shade951)"/>
  <g fill="#FFFDF9" font-family="Georgia, 'Times New Roman', serif">
    <text x="49" y="990" font-size="55" font-style="italic" opacity="0.95">Mara</text>
    <text x="49" y="1039" font-family="Helvetica, Arial, sans-serif" font-size="19" letter-spacing="3" opacity="0.72" text-transform="uppercase">Colour director</text>
  </g>
  <rect x="0.5" y="0.5" width="899" height="1099" fill="none" stroke="#A0714F" stroke-opacity="0.25"/>
</svg>
