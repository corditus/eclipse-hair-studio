<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="900" height="1100" role="img" aria-label="Sena placeholder">
  <defs>
    <linearGradient id="bg985" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFE6D9"/>
      <stop offset="1" stop-color="#D8BCA0"/>
    </linearGradient>
    <radialGradient id="glow985" cx="60%" cy="22%" r="72%">
      <stop offset="0" stop-color="#FFFDF9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFDF9" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain985">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <linearGradient id="shade985" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.34"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1100" fill="url(#bg985)"/>
  <rect width="900" height="1100" fill="url(#glow985)"/>
  <rect width="900" height="1100" filter="url(#grain985)" opacity="0.23"/>
  <rect width="900" height="1100" fill="url(#shade985)"/>
  <g fill="#FFFDF9" font-family="Georgia, 'Times New Roman', serif">
    <text x="49" y="990" font-size="55" font-style="italic" opacity="0.95">Sena</text>
    <text x="49" y="1039" font-family="Helvetica, Arial, sans-serif" font-size="19" letter-spacing="3" opacity="0.72" text-transform="uppercase">Stylist &amp; texture</text>
  </g>
  <rect x="0.5" y="0.5" width="899" height="1099" fill="none" stroke="#B5654A" stroke-opacity="0.25"/>
