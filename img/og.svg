<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Eclipse Hair Salon placeholder">
  <defs>
    <linearGradient id="bg1234" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E4D3C4"/>
      <stop offset="1" stop-color="#B98A6C"/>
    </linearGradient>
    <radialGradient id="glow1234" cx="30%" cy="22%" r="72%">
      <stop offset="0" stop-color="#FFFDF9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFDF9" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain1234">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <linearGradient id="shade1234" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.34"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg1234)"/>
  <rect width="1200" height="630" fill="url(#glow1234)"/>
  <rect width="1200" height="630" filter="url(#grain1234)" opacity="0.21"/>
  <rect width="1200" height="630" fill="url(#shade1234)"/>
  <g fill="#FFFDF9" font-family="Georgia, 'Times New Roman', serif">
    <text x="66" y="567" font-size="39" font-style="italic" opacity="0.95">Eclipse Hair Salon</text>
    <text x="66" y="602" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2" opacity="0.72" text-transform="uppercase">Quietly modern hair, Portland</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#6E3F2E" stroke-opacity="0.25"/>
</svg>
