<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" role="img" aria-label="Glass-skin blowout placeholder">
  <defs>
    <linearGradient id="bg1153" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDE3D6"/>
      <stop offset="1" stop-color="#CBB49B"/>
    </linearGradient>
    <radialGradient id="glow1153" cx="72%" cy="48%" r="72%">
      <stop offset="0" stop-color="#FFFDF9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFDF9" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain1153">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <linearGradient id="shade1153" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.34"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="1250" fill="url(#bg1153)"/>
  <rect width="1000" height="1250" fill="url(#glow1153)"/>
  <rect width="1000" height="1250" filter="url(#grain1153)" opacity="0.26"/>
  <rect width="1000" height="1250" fill="url(#shade1153)"/>
  <g fill="#FFFDF9" font-family="Georgia, 'Times New Roman', serif">
    <text x="55" y="1125" font-size="62" font-style="italic" opacity="0.95">Glass-skin blowout</text>
    <text x="55" y="1180" font-family="Helvetica, Arial, sans-serif" font-size="22" letter-spacing="4" opacity="0.72" text-transform="uppercase">Look</text>
  </g>
  <rect x="0.5" y="0.5" width="999" height="1249" fill="none" stroke="#9C6B4E" stroke-opacity="0.25"/>
</svg>
