<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1050" width="1000" height="1050" role="img" aria-label="Precision line placeholder">
  <defs>
    <linearGradient id="bg1272" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E7D8C6"/>
      <stop offset="1" stop-color="#C79A7B"/>
    </linearGradient>
    <radialGradient id="glow1272" cx="30%" cy="22%" r="72%">
      <stop offset="0" stop-color="#FFFDF9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFDF9" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain1272">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <linearGradient id="shade1272" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.34"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="1050" fill="url(#bg1272)"/>
  <rect width="1000" height="1050" fill="url(#glow1272)"/>
  <rect width="1000" height="1050" filter="url(#grain1272)" opacity="0.28"/>
  <rect width="1000" height="1050" fill="url(#shade1272)"/>
  <g fill="#FFFDF9" font-family="Georgia, 'Times New Roman', serif">
    <text x="55" y="945" font-size="62" font-style="italic" opacity="0.95">Precision line</text>
    <text x="55" y="1000" font-family="Helvetica, Arial, sans-serif" font-size="22" letter-spacing="4" opacity="0.72" text-transform="uppercase">Look</text>
  </g>
  <rect x="0.5" y="0.5" width="999" height="1049" fill="none" stroke="#8A4F38" stroke-opacity="0.25"/>
</svg>
