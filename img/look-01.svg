<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1300" width="1000" height="1300" role="img" aria-label="Soft balayage placeholder">
  <defs>
    <linearGradient id="bg1085" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFE6D9"/>
      <stop offset="1" stop-color="#D8BCA0"/>
    </linearGradient>
    <radialGradient id="glow1085" cx="30%" cy="22%" r="72%">
      <stop offset="0" stop-color="#FFFDF9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFDF9" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain1085">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <linearGradient id="shade1085" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.34"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="1300" fill="url(#bg1085)"/>
  <rect width="1000" height="1300" fill="url(#glow1085)"/>
  <rect width="1000" height="1300" filter="url(#grain1085)" opacity="0.29"/>
  <rect width="1000" height="1300" fill="url(#shade1085)"/>
  <g fill="#FFFDF9" font-family="Georgia, 'Times New Roman', serif">
    <text x="55" y="1170" font-size="62" font-style="italic" opacity="0.95">Soft balayage</text>
    <text x="55" y="1225" font-family="Helvetica, Arial, sans-serif" font-size="22" letter-spacing="4" opacity="0.72" text-transform="uppercase">Look</text>
  </g>
  <rect x="0.5" y="0.5" width="999" height="1299" fill="none" stroke="#B5654A" stroke-opacity="0.25"/>
</svg>
