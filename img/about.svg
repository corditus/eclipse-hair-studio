<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1400" width="1200" height="1400" role="img" aria-label="Inside the studio placeholder">
  <defs>
    <linearGradient id="bg1217" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDE3D6"/>
      <stop offset="1" stop-color="#CBB49B"/>
    </linearGradient>
    <radialGradient id="glow1217" cx="45%" cy="48%" r="72%">
      <stop offset="0" stop-color="#FFFDF9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFDF9" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain1217">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <linearGradient id="shade1217" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.34"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1400" fill="url(#bg1217)"/>
  <rect width="1200" height="1400" fill="url(#glow1217)"/>
  <rect width="1200" height="1400" filter="url(#grain1217)" opacity="0.28"/>
  <rect width="1200" height="1400" fill="url(#shade1217)"/>
  <g fill="#FFFDF9" font-family="Georgia, 'Times New Roman', serif">
    <text x="66" y="1260" font-size="74" font-style="italic" opacity="0.95">Inside the studio</text>
    <text x="66" y="1326" font-family="Helvetica, Arial, sans-serif" font-size="26" letter-spacing="4" opacity="0.72" text-transform="uppercase">Eclipse Hair Salon</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="1399" fill="none" stroke="#9C6B4E" stroke-opacity="0.25"/>
</svg>
