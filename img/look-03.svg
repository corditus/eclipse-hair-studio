<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1400" width="1000" height="1400" role="img" aria-label="Copper gloss placeholder">
  <defs>
    <linearGradient id="bg1119" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2EADF"/>
      <stop offset="1" stop-color="#DBC1A6"/>
    </linearGradient>
    <radialGradient id="glow1119" cx="30%" cy="34%" r="72%">
      <stop offset="0" stop-color="#FFFDF9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFDF9" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain1119">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <linearGradient id="shade1119" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.34"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="1400" fill="url(#bg1119)"/>
  <rect width="1000" height="1400" fill="url(#glow1119)"/>
  <rect width="1000" height="1400" filter="url(#grain1119)" opacity="0.28"/>
  <rect width="1000" height="1400" fill="url(#shade1119)"/>
  <g fill="#FFFDF9" font-family="Georgia, 'Times New Roman', serif">
    <text x="55" y="1260" font-size="62" font-style="italic" opacity="0.95">Copper gloss</text>
    <text x="55" y="1315" font-family="Helvetica, Arial, sans-serif" font-size="22" letter-spacing="4" opacity="0.72" text-transform="uppercase">Look</text>
  </g>
  <rect x="0.5" y="0.5" width="999" height="1399" fill="none" stroke="#A5714F" stroke-opacity="0.25"/>
</svg>
